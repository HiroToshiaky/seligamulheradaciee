<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Ícone de violência psicológica: rosto de expressão triste e confusa, cercado por espirais representando manipulação e confusão mental">
  <defs>
    <linearGradient id="grad-psico3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B59B6"/>
      <stop offset="100%" stop-color="#6B2D8B"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="56" fill="url(#grad-psico3)"/>

  <!-- Rosto: círculo simples, expressão de aflição -->
  <circle cx="60" cy="62" r="24" fill="#FFFFFF"/>

  <!-- Olhos em "X", indicando confusão/aflição -->
  <g stroke="#4A1870" stroke-width="3.5" stroke-linecap="round">
    <path d="M48 55 L54 61 M54 55 L48 61"/>
    <path d="M66 55 L72 61 M72 55 L66 61"/>
  </g>

  <!-- Boca curvada para baixo, tristeza -->
  <path d="M50 76 Q60 68 70 76" fill="none" stroke="#4A1870" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Espirais ao redor da cabeça, representando manipulação/confusão mental -->
  <g fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".85">
    <path d="M30 40 c-6-2-10 2-9 7 c1 4 6 5 8 2"/>
    <path d="M90 40 c6-2 10 2 9 7 c-1 4-6 5-8 2"/>
    <path d="M34 90 c-5 3-11 1-11-4 c0-4 5-6 8-4"/>
    <path d="M86 90 c5 3 11 1 11-4 c0-4-5-6-8-4"/>
  </g>
</svg>
